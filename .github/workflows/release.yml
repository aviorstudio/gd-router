name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency: release-${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # Bounded, so a step that hangs fails here rather than sitting until the
    # runner's own timeout hours later.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo 'Run releases from the main branch.' >&2
            exit 1
          fi
          git fetch --tags --force
          latest="$(git tag --list 'v[0-9]*' | sed -E 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "$latest" ]; then
            version="0.0.1"
          else
            IFS=. read -r major minor patch <<< "$latest"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
            esac
            version="${major}.${minor}.${patch}"
          fi
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi
          plugin_version="$(sed -n -E 's/^version="([^"]+)"/\1/p' addon/plugin.cfg | head -n 1)"
          if [ "$plugin_version" != "$version" ]; then
            echo "addon/plugin.cfg version is $plugin_version, but the next $BUMP release is $version." >&2
            echo "Update addon/plugin.cfg to version=\"$version\", commit it, then rerun this workflow." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The same checks CI runs, from the same definition. This workflow used
      # to package and publish without running any of them -- the only thing
      # between a broken commit and the GDAM registry was whether somebody had
      # looked at CI. Running them here against this exact commit is the point:
      # CI passing on this SHA earlier is a claim about that run.
      - name: Test
        uses: ./.github/actions/test

      - name: Record exact package identity
        run: ./scripts/package_addon.py --output dist/@aviorstudio_gd-router.zip --verify-only | tee dist/package-identity.txt

      - name: Upload tested release bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-release-${{ github.sha }}
          path: |
            dist/@aviorstudio_gd-router.zip
            dist/package-identity.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-release-${{ github.sha }}
          path: dist

      - name: Re-read exact release identity
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          ./scripts/package_addon.py --output dist/@aviorstudio_gd-router.zip --verify-only
          version="$(sed -n -E 's/^version="([^"]+)"/\1/p' addon/plugin.cfg)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release create "$TAG" dist/@aviorstudio_gd-router.zip --target "$GITHUB_SHA" --title "$TAG" --notes-file dist/package-identity.txt

      - name: Install GDAM
        uses: aviorstudio/gdam-actions/install@d735444eb470194585def44521d5d91df2260e63 # v0.0.2
        with:
          version: v0.0.8

      - name: Publish to GDAM
        uses: aviorstudio/gdam-actions/publish@d735444eb470194585def44521d5d91df2260e63 # v0.0.2
        with:
          tag: ${{ steps.release.outputs.tag }}
          asset: '@aviorstudio_gd-router.zip'
          secret-key: ${{ secrets.GDAM_SECRET_KEY }}
