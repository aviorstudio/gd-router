name: Release
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
        - patch
        - minor
        - major
permissions:
  contents: read
concurrency: release-${{ github.repository }}
jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Set up locked Komizo
      uses: nicodes/komizo/setup@40086036977a5fc0119d6c4c1d5eb6ae3ab3b4b9
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Determine release version
      id: release
      env:
        BUMP: ${{ inputs.bump }}
      run: |
        set -euo pipefail
        if [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo 'Run releases from the main branch.' >&2
          exit 1
        fi
        git fetch --tags --force
        latest="$(git tag --list 'v[0-9]*' | sed -E 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
        if [ -z "$latest" ]; then
          version="0.0.1"
        else
          IFS=. read -r major minor patch <<< "$latest"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
          esac
          version="${major}.${minor}.${patch}"
        fi
        tag="v${version}"
        if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
          echo "Tag already exists: $tag" >&2
          exit 1
        fi
        plugin_version="$(sed -n -E 's/^version="([^"]+)"/\1/p' addon/plugin.cfg | head -n 1)"
        if [ "$plugin_version" != "$version" ]; then
          echo "addon/plugin.cfg version is $plugin_version, but the next $BUMP release is $version." >&2
          echo "Update addon/plugin.cfg to version=\"$version\", commit it, then rerun this workflow." >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
    - name: Check project
      uses: nicodes/komizo/run@40086036977a5fc0119d6c4c1d5eb6ae3ab3b4b9
      with:
        target: check
    - name: Record exact package identity
      run: ./scripts/package_addon.py --output dist/@aviorstudio_gd-router.zip --verify-only | tee dist/package-identity.txt
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: tested-release-${{ github.sha }}
        path: |
          dist/@aviorstudio_gd-router.zip
          dist/package-identity.txt
        if-no-files-found: error
        retention-days: 7
    permissions:
      contents: read
      attestations: read
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
  publish:
    name: Publish release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Download artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: tested-release-${{ github.sha }}
        path: dist
    - name: Re-read exact release identity
      id: release
      env:
        BUMP: ${{ inputs.bump }}
      run: |
        set -euo pipefail
        ./scripts/package_addon.py --output dist/@aviorstudio_gd-router.zip --verify-only
        version="$(sed -n -E 's/^version="([^"]+)"/\1/p' addon/plugin.cfg)"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag=v$version" >> "$GITHUB_OUTPUT"
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.release.outputs.tag }}
      run: gh release create "$TAG" dist/@aviorstudio_gd-router.zip --target "$GITHUB_SHA" --title "$TAG" --notes-file dist/package-identity.txt
    - name: Publish addon
      uses: aviorstudio/gdam-actions/publish@6677226d9353df1d410f3e7f5075e13b3b7d5308
      with:
        tag: ${{ steps.release.outputs.tag }}
        asset: '@aviorstudio_gd-router.zip'
        api-key: ${{ secrets.GDAM_API_KEY }}
