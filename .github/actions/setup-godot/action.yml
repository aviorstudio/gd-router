name: "Set up Godot"
description: Install the repository-reviewed engine and templates through released shared setup
runs:
  using: composite
  steps:
    - name: "Set up Godot"
      uses: nicodes/tools/godot-setup@ca747e13a51f301f51635c262d883d57d6084ae3 # v0.27.1
      with:
        version: '4.7.2'
        origin: godot-builds
        binary-checksum: sha512:9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
        templates-checksum: sha512:ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079
        install-templates: 'true'
        expected-version: 4.7.2.stable.official.ed1daf0bf
    - name: Verify required web template
      shell: bash
      run: test -f "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_release.zip"
